aidin_gripper_driver:
  ros__parameters:
    # Serial link
    port: "/dev/ttyUSB0"     # Windows: "COM3"
    baudrate: 115200
    parity: "N"               # 'N' / 'E' / 'O'
    slave_id: 1               # firmware default

    # Behaviour
    publish_rate_hz: 50.0
    auto_activate: true       # set rACT=1 at startup
    auto_home: false          # call home() at startup (set true on systems where boot-time homing is safe)
